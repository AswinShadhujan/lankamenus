# CI: pnpm workspace (api at root) + standalone web app lockfile.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    continue-on-error: true

    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lankamenus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lankamenus_test?schema=public
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      E2E_DATABASE_READY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert root Dockerfile is Docker/Railway-safe
        run: |
          test -f Dockerfile
          grep -q 'COPY services/api/prisma' Dockerfile
          grep -q 'COPY services/api/prisma.config.ts' Dockerfile
          grep -q 'ignore-scripts' Dockerfile
          grep -q 'pnpm rebuild' Dockerfile
          grep -q 'prisma generate' Dockerfile

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-root-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'services/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-root-

      - name: Install workspace (API)
        run: pnpm install --frozen-lockfile

      - name: Lint API (non-blocking)
        run: pnpm --filter api run lint || true

      - name: Unit test API
        run: pnpm --filter api run test

      - name: Prisma generate + migrate (e2e DB)
        run: |
          pnpm --filter api exec prisma generate
          pnpm --filter api exec prisma migrate deploy

      - name: E2E test API (non-blocking)
        run: pnpm --filter api run test:e2e || true

      - name: Build API
        run: pnpm --filter api run build

      - name: Cache pnpm store (web)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-web-${{ hashFiles('apps/web/pnpm-lock.yaml', 'apps/web/package.json') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-web-

      - name: Install + build web
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
